<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Principales incertidumbres del proyecto y mecanismos de validación</title>
  <desc id="desc">Tabla visual con cuatro tipos de incertidumbre: deseabilidad, viabilidad técnica, viabilidad económica y escalabilidad. Para cada una se incluye una pregunta clave y su mecanismo de validación.</desc>

  <rect width="1600" height="900" fill="#f7f9fb"/>
  <rect x="0" y="0" width="18" height="900" fill="#17324d"/>

  <text x="80" y="86" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">
    Principales incertidumbres del proyecto
  </text>
  <text x="80" y="135" fill="#2a7f83" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">
    y mecanismos de validación
  </text>
  <text x="80" y="177" fill="#607080" font-family="Arial, Helvetica, sans-serif" font-size="21">
    Marco para reducir el riesgo del proyecto mediante evidencia progresiva
  </text>

  <rect x="60" y="215" width="1480" height="62" rx="8" fill="#17324d"/>
  <text x="88" y="254" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="0.7">
    TIPO DE INCERTIDUMBRE
  </text>
  <text x="425" y="254" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="0.7">
    PREGUNTA CLAVE
  </text>
  <text x="1035" y="254" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="0.7">
    MECANISMO DE VALIDACIÓN
  </text>

  <!-- Fila 1 -->
  <rect x="60" y="291" width="1480" height="118" rx="8" fill="#ffffff"/>
  <rect x="60" y="291" width="8" height="118" rx="4" fill="#2a7f83"/>
  <circle cx="105" cy="350" r="25" fill="#e1f0f0"/>
  <text x="105" y="357" text-anchor="middle" fill="#236b6f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">01</text>
  <text x="145" y="358" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Deseabilidad</text>
  <line x1="395" y1="311" x2="395" y2="389" stroke="#dce3e8" stroke-width="2"/>
  <text x="425" y="343" fill="#253746" font-family="Arial, Helvetica, sans-serif" font-size="23">
    <tspan x="425" dy="0">¿El deportista necesita centralizar</tspan>
    <tspan x="425" dy="31">su experiencia deportiva?</tspan>
  </text>
  <line x1="1005" y1="311" x2="1005" y2="389" stroke="#dce3e8" stroke-width="2"/>
  <text x="1035" y="343" fill="#253746" font-family="Arial, Helvetica, sans-serif" font-size="23">
    <tspan x="1035" dy="0">Entrevistas, encuestas</tspan>
    <tspan x="1035" dy="31">y pruebas de uso</tspan>
  </text>

  <!-- Fila 2 -->
  <rect x="60" y="423" width="1480" height="118" rx="8" fill="#ffffff"/>
  <rect x="60" y="423" width="8" height="118" rx="4" fill="#4d72a8"/>
  <circle cx="105" cy="482" r="25" fill="#e5ebf4"/>
  <text x="105" y="489" text-anchor="middle" fill="#3d5d8a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">02</text>
  <text x="145" y="473" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
    <tspan x="145" dy="0">Viabilidad</tspan>
    <tspan x="145" dy="30">técnica</tspan>
  </text>
  <line x1="395" y1="443" x2="395" y2="521" stroke="#dce3e8" stroke-width="2"/>
  <text x="425" y="459" fill="#253746" font-family="Arial, Helvetica, sans-serif" font-size="23">
    <tspan x="425" dy="0">¿Puede desarrollarse un MVP funcional</tspan>
    <tspan x="425" dy="31">con los recursos disponibles?</tspan>
  </text>
  <line x1="1005" y1="443" x2="1005" y2="521" stroke="#dce3e8" stroke-width="2"/>
  <text x="1035" y="459" fill="#253746" font-family="Arial, Helvetica, sans-serif" font-size="23">
    <tspan x="1035" dy="0">Prototipo, pruebas técnicas</tspan>
    <tspan x="1035" dy="31">e integración limitada</tspan>
  </text>

  <!-- Fila 3 -->
  <rect x="60" y="555" width="1480" height="118" rx="8" fill="#ffffff"/>
  <rect x="60" y="555" width="8" height="118" rx="4" fill="#c78b34"/>
  <circle cx="105" cy="614" r="25" fill="#f6ead8"/>
  <text x="105" y="621" text-anchor="middle" fill="#966722" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">03</text>
  <text x="145" y="605" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">
    <tspan x="145" dy="0">Viabilidad</tspan>
    <tspan x="145" dy="30">económica</tspan>
  </text>
  <line x1="395" y1="575" x2="395" y2="653" stroke="#dce3e8" stroke-width="2"/>
  <text x="425" y="621" fill="#253746" font-family="Arial, Helvetica, sans-serif" font-size="23">
    ¿Quién está dispuesto a pagar y por qué?
  </text>
  <line x1="1005" y1="575" x2="1005" y2="653" stroke="#dce3e8" stroke-width="2"/>
  <text x="1035" y="591" fill="#253746" font-family="Arial, Helvetica, sans-serif" font-size="23">
    <tspan x="1035" dy="0">Test de precios y entrevistas</tspan>
    <tspan x="1035" dy="31">a organizadores</tspan>
  </text>

  <!-- Fila 4 -->
  <rect x="60" y="687" width="1480" height="118" rx="8" fill="#ffffff"/>
  <rect x="60" y="687" width="8" height="118" rx="4" fill="#7564a8"/>
  <circle cx="105" cy="746" r="25" fill="#ebe7f4"/>
  <text x="105" y="753" text-anchor="middle" fill="#5c4d88" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">04</text>
  <text x="145" y="754" fill="#17324d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Escalabilidad</text>
  <line x1="395" y1="707" x2="395" y2="785" stroke="#dce3e8" stroke-width="2"/>
  <text x="425" y="723" fill="#253746" font-family="Arial, Helvetica, sans-serif" font-size="23">
    <tspan x="425" dy="0">¿Puede crecer hacia más deportes,</tspan>
    <tspan x="425" dy="31">zonas y servicios?</tspan>
  </text>
  <line x1="1005" y1="707" x2="1005" y2="785" stroke="#dce3e8" stroke-width="2"/>
  <text x="1035" y="723" fill="#253746" font-family="Arial, Helvetica, sans-serif" font-size="23">
    <tspan x="1035" dy="0">Análisis de mercado, roadmap</tspan>
    <tspan x="1035" dy="31">e hipótesis de expansión</tspan>
  </text>

  <line x1="80" y1="842" x2="1520" y2="842" stroke="#cfd9e0" stroke-width="2"/>
  <text x="80" y="874" fill="#607080" font-family="Arial, Helvetica, sans-serif" font-size="18">Fuente: elaboración propia.</text>
  <text x="1520" y="874" text-anchor="end" fill="#607080" font-family="Arial, Helvetica, sans-serif" font-size="18">Marco de validación del proyecto</text>
</svg>

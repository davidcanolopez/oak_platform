<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Principales incertidumbres del proyecto y mecanismos de validación</title>
  <desc id="desc">Tabla con cuatro tipos de incertidumbre, sus preguntas clave y sus mecanismos de validación.</desc>

  <text x="55" y="48" fill="#596b76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">TIPO DE INCERTIDUMBRE</text>
  <text x="420" y="48" fill="#596b76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">PREGUNTA CLAVE</text>
  <text x="1050" y="48" fill="#596b76" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="0.8">MECANISMO DE VALIDACIÓN</text>
  <line x1="45" y1="72" x2="1555" y2="72" stroke="#cbd5db" stroke-width="2"/>

  <circle cx="76" cy="137" r="18" fill="#dcefeb"/>
  <circle cx="76" cy="137" r="7" fill="#7faeaa"/>
  <text x="112" y="145" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Deseabilidad</text>
  <text x="420" y="128" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="420">¿El deportista necesita centralizar</tspan>
    <tspan x="420" dy="32">su experiencia deportiva?</tspan>
  </text>
  <text x="1050" y="128" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="1050">Entrevistas, encuestas</tspan>
    <tspan x="1050" dy="32">y pruebas de uso</tspan>
  </text>
  <line x1="45" y1="202" x2="1555" y2="202" stroke="#d9e1e5" stroke-width="2"/>

  <circle cx="76" cy="267" r="18" fill="#e6edf5"/>
  <circle cx="76" cy="267" r="7" fill="#8fa6c1"/>
  <text x="112" y="259" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">
    <tspan x="112">Viabilidad</tspan>
    <tspan x="112" dy="30">técnica</tspan>
  </text>
  <text x="420" y="258" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="420">¿Puede desarrollarse un MVP funcional</tspan>
    <tspan x="420" dy="32">con los recursos disponibles?</tspan>
  </text>
  <text x="1050" y="258" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="1050">Prototipo, pruebas técnicas</tspan>
    <tspan x="1050" dy="32">e integración limitada</tspan>
  </text>
  <line x1="45" y1="332" x2="1555" y2="332" stroke="#d9e1e5" stroke-width="2"/>

  <circle cx="76" cy="397" r="18" fill="#f4ead8"/>
  <circle cx="76" cy="397" r="7" fill="#c6a56a"/>
  <text x="112" y="389" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">
    <tspan x="112">Viabilidad</tspan>
    <tspan x="112" dy="30">económica</tspan>
  </text>
  <text x="420" y="405" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="22">¿Quién está dispuesto a pagar y por qué?</text>
  <text x="1050" y="388" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="1050">Test de precios y entrevistas</tspan>
    <tspan x="1050" dy="32">a organizadores</tspan>
  </text>
  <line x1="45" y1="462" x2="1555" y2="462" stroke="#d9e1e5" stroke-width="2"/>

  <circle cx="76" cy="527" r="18" fill="#eeeaf5"/>
  <circle cx="76" cy="527" r="7" fill="#9e90ba"/>
  <text x="112" y="535" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Escalabilidad</text>
  <text x="420" y="518" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="420">¿Puede crecer hacia más deportes,</tspan>
    <tspan x="420" dy="32">zonas y servicios?</tspan>
  </text>
  <text x="1050" y="518" fill="#2d404d" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="1050">Análisis de mercado, roadmap</tspan>
    <tspan x="1050" dy="32">e hipótesis de expansión</tspan>
  </text>
  <line x1="45" y1="592" x2="1555" y2="592" stroke="#cbd5db" stroke-width="2"/>
</svg>
